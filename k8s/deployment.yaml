apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-market-v2
  labels:
    app: stock-market-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-market-v2
  template:
    metadata:
      labels:
        app: stock-market-v2
    spec:
      containers:
        - name: web
          image: stock-market-v2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: STOCK_API_BASE
              value: "https://stocks3.onrender.com"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: stock-market-v2
  labels:
    app: stock-market-v2
spec:
  type: ClusterIP
  selector:
    app: stock-market-v2
  ports:
    - name: http
      port: 80
      targetPort: http
